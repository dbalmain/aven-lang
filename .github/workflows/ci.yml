name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shells for CLI completion tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bash fish
          # Printed so a runner-image bump that changes completion behaviour is
          # visible in the log rather than only in a failing assertion.
          bash --version | head -1
          fish --version
      # Pinned so a rustup stable bump cannot turn a new clippy lint into a
      # red main without a matching repo bump. Keep in lockstep with
      # rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Check the declared minimum Rust version
        env:
          # rust-toolchain.toml pins 1.98.1 for clippy. rustup honours that
          # file over `rustup default`, so force the declared MSRV here.
          RUSTUP_TOOLCHAIN: 1.91.0
        run: |
          rustc --version
          cargo check --workspace --all-targets
