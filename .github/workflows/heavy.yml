name: Heavy

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  rust-heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shells for CLI completion tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bash fish
          # Printed so a runner-image bump that changes completion behaviour is
          # visible in the log rather than only in a failing assertion.
          bash --version | head -1
          fish --version
      # Same pin as CI / rust-toolchain.toml; see ci.yml.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - name: heavy tests
        env:
          PROPTEST_CASES: "8192"
          # A `prop_assume!` rejection costs a case but not a failure, and the
          # ceiling on them does not scale with PROPTEST_CASES: proptest's
          # default is a flat 1024, which at 8192 cases aborts any property
          # rejecting more than about a percent of its inputs. Held at the
          # same 4:1 ratio proptest ships for its own 256-case default, so
          # raising PROPTEST_CASES does not silently turn a tolerable
          # rejection rate into a red nightly.
          PROPTEST_MAX_GLOBAL_REJECTS: "32768"
        run: cargo test --workspace -- --include-ignored
